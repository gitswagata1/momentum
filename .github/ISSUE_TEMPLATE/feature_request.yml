name: Feature Request
description: Suggest an enhancement or new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI Pipeline (transcription / MOM / tasks)
        - Task Management
        - Notifications
        - Authentication
        - Dashboard / Analytics
        - Frontend / UI
        - Deployment
        - Documentation
        - Other
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, or examples
